# Training branch: builds example A of the developer path (« Exécution du
# budget »); releases are built from main.
#
# The upstream code this repository builds, pinned by commit. Read by
# scripts/fetch-upstream.sh, which checks every value below. Written by
# scripts/dev-lock.sh (make dev-lock) from the sibling checkouts, or by hand;
# what a pinned commit brings is said in the commit that changes this file.
#
# Dashboard: one commit, or the merge of two commits of the same repository,
# checked against the tree it must produce (DASHBOARD_TREE).
DASHBOARD_URL=https://github.com/mfb-dgbf/rpf-country-dash.git
DASHBOARD_REFS="refs/heads/formation/exemple-a-execution"
DASHBOARD_COMMITS="726f1ac99d52fca1d6e9a4b2eb915011ee47b26c"
DASHBOARD_TREE=81bb980e2ac952e4b7dd3850e2e27070b308baee

# Indicator ETL, from the mfb-dgbf fork of dime-worldbank/mega-indicators: only the
# folders of the notebooks local_runner.notebooks() lists
# (the repository's top-level files are always checked out).
INDICATORS_URL=https://github.com/mfb-dgbf/mega-indicators.git
INDICATORS_REF=refs/heads/main
INDICATORS_COMMIT=f3ba605a9ec4f5451b0a6fbc3e632e7150fd0ab6
INDICATORS_PATHS="education geo health human_development pefa population poverty public_finance"

